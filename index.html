<style>
body{margin:0}
a{color:#151515}a:hover{color:#7A1E2C}
.ul{text-decoration:none;background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .35s ease,color .2s}
.ul:hover{background-size:100% 1px}
.ul-on{text-decoration:none;background-image:linear-gradient(currentColor,currentColor);background-size:100% 1px;background-repeat:no-repeat;background-position:0 100%}
.line{display:block;overflow:hidden;padding:0 .08em .06em}
.line > span{display:block;animation:up 1s cubic-bezier(.2,.7,.1,1) both}
@keyframes up{from{transform:translateY(108%)}to{transform:none}}
.fade{animation:fade .9s cubic-bezier(.2,.7,.1,1) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scene{animation:scene 1.4s cubic-bezier(.2,.7,.1,1) both .35s}
@keyframes scene{from{opacity:0;clip-path:inset(12% 4% 12% 4% round 8px)}to{opacity:1;clip-path:inset(0 0 0 0 round 8px)}}
@keyframes hop{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-14px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-10px)}}
@keyframes wave{0%{opacity:0;transform:scale(.5)}35%{opacity:.9}100%{opacity:0;transform:scale(1.5)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(21,21,21,.35)}80%,100%{box-shadow:0 0 0 16px rgba(21,21,21,0)}}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.caret{display:inline-block;width:2px;height:.9em;background:#151515;margin-left:3px;vertical-align:-0.06em;animation:blink 1s steps(1) infinite}
.hop{animation:hop 2s cubic-bezier(.3,.6,.3,1) infinite;transform-box:fill-box;transform-origin:50% 100%}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}
.drift{animation:drift 18s ease-in-out infinite alternate}
.float{animation:float 8s ease-in-out infinite}
.wave{animation:wave 2.8s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.pin{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;margin:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;z-index:2}
.pin-dot{width:34px;height:34px;border-radius:50%;background:#151515;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;box-shadow:0 0 0 3px #FFFFFF,0 6px 14px rgba(21,21,21,.25);transition:transform .25s cubic-bezier(.2,.7,.1,1),background .2s}
.pin.ring .pin-dot{animation:ping 2s ease-out infinite}
.pin.seen .pin-dot{background:#FFFFFF;color:#151515}
.pin.active .pin-dot{background:#7A1E2C;color:#FFFFFF;transform:scale(1.15)}
.pin:hover .pin-dot{transform:scale(1.12)}
.pin-main .pin-dot{width:46px;height:46px;font-size:16px;background:#7A1E2C}
.pin-main.seen .pin-dot{background:#FFFFFF;color:#7A1E2C}
.pin-tag{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:3px;background:#7A1E2C;color:#FFFFFF;font-size:11px;font-weight:600;letter-spacing:.02em}
.pin-label{background:rgba(255,255,255,.94);color:#151515;border-radius:4px;padding:5px 9px;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 4px 12px rgba(21,21,21,.12);opacity:.92;transition:opacity .2s}
.pin:hover .pin-label,.pin.active .pin-label{opacity:1}
.pin:focus-visible{outline:2px solid #7A1E2C;outline-offset:6px;border-radius:8px}
.panel{animation:slidein .4s cubic-bezier(.2,.7,.1,1) both}
.row:hover .row-title{color:#7A1E2C}
.row:hover .row-arrow{transform:translateX(4px)}
.row-arrow{transition:transform .25s}
.hero-row{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:flex-end;justify-content:space-between}
@media (max-width:1240px){.pin-label{font-size:12px;padding:4px 8px}.pin:not(.pin-main):not(.active):not(:hover):not(:focus-visible) .pin-label{display:none}}
@media (max-width:820px){.facts{grid-template-columns:repeat(2,minmax(0,1fr)) !important;row-gap:16px !important}.pin-label{display:none}.pin-dot{width:34px;height:34px;font-size:13px}.panel{position:fixed !important;left:0 !important;right:0 !important;bottom:0 !important;top:auto !important;width:auto !important;max-height:86vh;border-radius:16px 16px 0 0 !important;z-index:60 !important;animation:sheet .35s cubic-bezier(.2,.7,.1,1) both !important}.backdrop{position:fixed !important;z-index:59 !important;background:rgba(21,21,21,.45) !important}.scene{animation:none !important;clip-path:none !important;opacity:1 !important}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.line > span,.fade,.scene,.hop,.bob,.drift,.float,.wave,.panel,.pin.ring .pin-dot,.caret{animation:none !important}}
@media (max-width:900px){.tl{grid-template-columns:repeat(2,minmax(0,1fr)) !important;row-gap:28px !important}.tl>div[aria-hidden]{display:none}}
.proof:hover span:last-child{color:#7A1E2C}
@media (max-width:700px){.proofs{grid-template-columns:repeat(2,minmax(0,1fr)) !important}}
</style>

</nav>
</div>

<h1 style="margin: 0; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: clamp(56px, 8.4vw, 124px); line-height: 0.92; letter-spacing: -0.05em; font-weight: 800">
<span class="line"><span>Angela Kalopisis</span></span>
</h1>
<p class="fade" style="margin: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 14px; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: clamp(22px, 2.3vw, 32px); line-height: 1.15; min-height: 1.25em; color: #6B675E; font-weight: 500; letter-spacing: -0.02em; animation-delay: .2s"><span>I'm a <span style="color: #151515; font-weight: 700">{{ typed }}</span><span class="caret" aria-hidden="true"></span></span><span style="font-family: 'Schibsted Grotesk', sans-serif; font-size: 15px; color: #6B675E; opacity: {{ yearOpacity }}; transition: opacity .3s; border-left: 1px solid #D8D2C4; padding-left: 14px">{{ roleYear }}</span></p>
<div class="fade proofs" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px 24px; width: 100%; max-width: 960px; margin-top: 14px; animation-delay: .3s"><button type="button" onClick="{{ pickWings }}" class="proof" style="background: none; border: 0; border-left: 1px solid #D8D2C4; padding: 2px 0 2px 16px; font: inherit; text-align: left; cursor: pointer; color: inherit; display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 800; font-size: clamp(36px, 3.6vw, 52px); line-height: 0.9; letter-spacing: -0.05em; color: #7A1E2C">2020</span><span style="font-size: 14px; line-height: 1.35; color: #3A3832">Building since, starting with Wings &amp; Water at 11</span></button><button type="button" onClick="{{ pickWings }}" class="proof" style="background: none; border: 0; border-left: 1px solid #D8D2C4; padding: 2px 0 2px 16px; font: inherit; text-align: left; cursor: pointer; color: inherit; display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 800; font-size: clamp(36px, 3.6vw, 52px); line-height: 0.9; letter-spacing: -0.05em; color: #151515">$22K+</span><span style="font-size: 14px; line-height: 1.35; color: #3A3832">in sales from Wings &amp; Water</span></button><button type="button" onClick="{{ pickMvp }}" class="proof" style="background: none; border: 0; border-left: 1px solid #D8D2C4; padding: 2px 0 2px 16px; font: inherit; text-align: left; cursor: pointer; color: inherit; display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 800; font-size: clamp(36px, 3.6vw, 52px); line-height: 0.9; letter-spacing: -0.05em; color: #151515">27</span><span style="font-size: 14px; line-height: 1.35; color: #3A3832">organizations on My Volunteer Pathway</span></button><button type="button" onClick="{{ pickLimitless }}" class="proof" style="background: none; border: 0; border-left: 1px solid #D8D2C4; padding: 2px 0 2px 16px; font: inherit; text-align: left; cursor: pointer; color: inherit; display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 800; font-size: clamp(36px, 3.6vw, 52px); line-height: 0.9; letter-spacing: -0.05em; color: #151515">Top 40</span><span style="font-size: 14px; line-height: 1.35; color: #3A3832">of 3,000+ teams, Diamond Challenge</span></button></div>
</div>

<div class="fade" style="display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: center; margin-bottom: -16px; font-size: 14px; color: #6B675E; animation-delay: .4s">
<span>Click a pin to explore, or use Next stop to see all nine.</span>
<span style="display: inline-flex; flex-wrap: wrap; gap: 8px 18px; align-items: center">
<span style="display: inline-flex; gap: 4px" aria-hidden="true"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="9"><span style="width: 14px; height: 3px; border-radius: 2px; background: {{ d.bg }}"></span></sc-for></span>

<button type="button" onClick="{{ goList }}" class="ul-on" style="background: none; border: 0; padding: 0; font: inherit; color: #6B675E; cursor: pointer">Prefer a list?</button>

<sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}"><button type="button" class="backdrop" onClick="{{ close }}" aria-label="Close the card" style="position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; background: rgba(21,21,21,.10); cursor: zoom-out"></button></sc-if>
<sc-for list="{{ stops }}" as="s" hint-placeholder-count="9">
<button type="button" class="{{ s.cls }}" style="left: {{ s.x }}; top: {{ s.y }}" onClick="{{ s.pick }}" aria-label="Explore {{ s.label }}" aria-pressed="{{ s.active }}"><span class="pin-dot">{{ s.mark }}</span><span class="pin-label">{{ s.label }}<sc-if value="{{ s.main }}" hint-placeholder-val="{{ false }}"><span class="pin-tag">Start here</span></sc-if></span></button>
</sc-for>

<sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
<aside class="panel" aria-live="polite" style="position: absolute; right: 16px; top: 16px; bottom: 16px; width: 420px; background: #FBF9F4; border-radius: 6px; overflow: auto; display: flex; flex-direction: column; z-index: 3; box-shadow: 0 1px 0 rgba(21,21,21,.06), 0 24px 60px rgba(43,37,34,.22)">
<div style="position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 8px 16px; background: #FBF9F4; border-bottom: 1px solid #E2DDD1">
<span style="font-size: 13px; color: #6B675E; font-variant-numeric: tabular-nums">{{ cur.num }} of {{ total }}</span>
<span style="display: flex; gap: 6px">
<button type="button" onClick="{{ prev }}" aria-label="Previous stop" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #D8D2C4; background: #FFFFFF; color: #151515; font: inherit; font-size: 14px; cursor: pointer">← Prev</button>
<button type="button" onClick="{{ close }}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #151515; background: #FFFFFF; color: #151515; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Close ✕</button>
</span>
</div>
<div style="position: relative; aspect-ratio: 4 / 3; flex-shrink: 0; background: #E2DDD1; overflow: hidden">
<sc-if value="{{ cur.hasImg }}" hint-placeholder-val="{{ true }}"><img src="{{ cur.img }}" alt="{{ cur.imgAlt }}" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: {{ cur.imgPos }}"></sc-if>
<sc-if value="{{ cur.noImg }}" hint-placeholder-val="{{ false }}"><div style="height: 100%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6B675E">[Photo · {{ cur.label }}]</div></sc-if>
</div>
<div style="padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 14px; flex: 1">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: #6B675E"><span>{{ cur.kicker }}</span></div>
<h2 style="margin: 0; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -0.03em">{{ cur.title }}</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A3832">{{ cur.body }}</p>
<sc-if value="{{ cur.hasBody2 }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A3832">{{ cur.body2 }}</p></sc-if>
<sc-if value="{{ cur.hasBody3 }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A3832">{{ cur.body3 }}</p></sc-if>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; border-top: 1px solid #151515; padding-top: 14px; margin-top: 2px">
<sc-for list="{{ cur.chips }}" as="c" hint-placeholder-count="3"><div><div style="font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">{{ c.v }}</div><div style="font-size: 12px; line-height: 1.35; color: #6B675E; margin-top: 6px">{{ c.l }}</div></div></sc-for>
